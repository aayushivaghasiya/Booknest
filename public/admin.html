<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — BookNest</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="logo">📚 BookNest</a>
      <nav class="nav-links">
        <a href="index.html">Storefront</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Admin — Manage Books</h1>

    <form id="bookForm" class="admin-form">
      <input type="hidden" id="bookId" />
      <div class="form-grid">
        <input type="text" id="title" placeholder="Title" required />
        <input type="text" id="author" placeholder="Author" required />
        <input type="text" id="category" placeholder="Category" required />
        <input type="number" id="price" placeholder="Price (₹)" required min="0" />
        <input type="number" id="stock" placeholder="Stock" required min="0" />
        <input type="text" id="cover" placeholder="Cover image URL (optional)" />
      </div>
      <textarea id="description" placeholder="Description"></textarea>
      <div class="form-actions">
        <button type="submit" class="btn primary" id="submitBtn">Add Book</button>
        <button type="button" class="btn secondary hidden" id="cancelEditBtn">Cancel Edit</button>
      </div>
    </form>

    <table class="admin-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Category</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="adminTableBody"></tbody>
    </table>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
